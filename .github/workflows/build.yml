name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build release APK
        run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: tubetv-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Publish APK as the latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk tubetv.apk
          # The commit message becomes the "what's new" text in the app's update prompt.
          { git log -1 --format=%B; echo; echo "Built from ${{ github.sha }}. Install: https://github.com/${{ github.repository }}/releases/latest/download/tubetv.apk"; } > notes.txt
          gh release create "build-${{ github.run_number }}" tubetv.apk \
            --target "${{ github.sha }}" --latest \
            --title "tubeTV build ${{ github.run_number }}" \
            --notes-file notes.txt

  probe-youtube:
    # Runs the app's YouTube client against the real site, to catch YouTube changes early.
    # GitHub's servers are sometimes asked to prove they aren't bots, so this never fails the build.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Run the app's YouTube client
        run: |
          status=0; TUBETV_LIVE=1 ./gradlew testDebugUnitTest --tests '*LiveYouTubeTest*' -q || status=$?
          # Print what the test printed, then the failure with its stack trace.
          python3 - <<'PY'
          import glob, re
          for f in glob.glob('app/build/test-results/testDebugUnitTest/*LiveYouTube*.xml'):
              xml = open(f).read()
              for m in re.findall(r'(?s)<system-out><!\[CDATA\[(.*?)\]\]>', xml): print(m)
              for m in re.findall(r'(?s)<failure[^>]*>(.*?)</failure>', xml): print(m[:6000])
          PY
          exit $status
